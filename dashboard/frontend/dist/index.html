<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rover</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
<style>
:root{--bg:#0b0d10;--card:#13161b;--b:#1f2530;--fg:#d8dde6;--m:#4a5568;--a:#00e5a0;--d:#ff3b3b;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'SF Mono',Consolas,monospace;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden;font-size:12px}
#app{display:grid;grid-template-columns:1fr 300px;grid-template-rows:40px 1fr;height:100vh}
#top{grid-column:1/-1;background:var(--card);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 12px;gap:12px}
#top h1{font-size:12px;color:var(--a);letter-spacing:2px;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--m);margin-right:3px;transition:background .3s}
.ok{background:var(--a)}.err{background:var(--d)}
.sep{flex:1}
.tag{padding:1px 7px;border-radius:3px;font-size:10px}
.tm{background:#2d1f1f;color:#ff8888}.te{background:#1f2a2d;color:#4da6ff}.tp{background:#221f2d;color:#b888ff}
#left{display:flex;flex-direction:column;overflow:hidden}
#cf{flex:1;background:#000;position:relative}
#ci{width:100%;height:100%;object-fit:cover;display:block}
#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;pointer-events:none}
.chip{background:rgba(0,0,0,.7);border:1px solid var(--b);padding:1px 7px;border-radius:3px;font-size:10px;color:var(--a)}
#mw{height:180px;background:#0a0c0f;border-top:1px solid var(--b);position:relative}
#mc{width:100%;height:100%}
#pose{position:absolute;bottom:4px;right:6px;font-size:9px;color:var(--m)}
#right{border-left:1px solid var(--b);overflow-y:auto;background:var(--card)}
.p{border-bottom:1px solid var(--b);padding:8px 10px}
.pt{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}

/* Digital speed buttons */
#speed-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-bottom:8px}
.spd-btn{padding:6px 2px;border:1px solid var(--b);background:var(--bg);color:var(--m);border-radius:3px;cursor:pointer;font-family:inherit;font-size:10px;text-align:center;transition:all .1s}
.spd-btn:hover{border-color:var(--a);color:var(--a)}
.spd-btn.active{background:var(--a);color:#000;border-color:var(--a);font-weight:bold}

/* Direction pad */
#dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;width:130px;height:130px;margin:0 auto}
.dp{border:1px solid var(--b);background:var(--bg);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .08s;user-select:none}
.dp:active,.dp.pressed{background:var(--a);color:#000}
.dp.empty{background:transparent;border:none;cursor:default}

/* Motor bars */
.mb-wrap{display:flex;align-items:center;gap:5px;margin-top:6px}
.mb-wrap span{width:8px;color:var(--m);font-size:9px}
.mb-out{flex:1;height:5px;background:var(--b);border-radius:3px;overflow:hidden}
.mb-in{height:100%;background:var(--a);width:0%;transition:width 60ms;border-radius:3px}
.mb-in.rev{background:var(--d)}

/* Mode buttons */
.btn-row{display:flex;gap:4px}
.btn{padding:5px 8px;border:1px solid var(--b);background:var(--bg);color:var(--fg);border-radius:3px;cursor:pointer;font-size:10px;font-family:inherit;transition:background .1s;flex:1;text-align:center}
.btn:hover{background:#1f2838}.btn.active{background:var(--a);color:#000;border-color:var(--a)}
#estop{width:100%;padding:9px;background:var(--d);color:#fff;border:none;border-radius:4px;font-size:13px;font-weight:bold;cursor:pointer;letter-spacing:2px;margin-top:5px;font-family:inherit}
#estop.stopped{background:#333}

/* Telemetry */
.tg{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.tc{background:var(--bg);border:1px solid var(--b);border-radius:3px;padding:3px 5px}
.tc .l{font-size:8px;color:var(--m);text-transform:uppercase}
.tc .v{font-size:11px;color:var(--a);font-weight:bold}
.tc .v.w{color:var(--d)}
</style>
</head>
<body>
<div id="app">
<header id="top">
  <h1>&#x25C6; Rover</h1>
  <span><span class="dot" id="ds"></span>Server</span>
  <span><span class="dot" id="da"></span>Arduino</span>
  <span><span class="dot" id="dc"></span>Camera</span>
  <span class="sep"></span>
  <span class="tag tm" id="mtag">MANUAL</span>
  <span id="clk" style="color:var(--m);font-size:10px"></span>
</header>

<div id="left">
  <div id="cf">
    <img id="ci" src="/api/camera/stream" alt="">
    <div id="hud">
      <span class="chip" id="hfps">FPS: —</span>
      <span class="chip" id="hlat">LAT: —ms</span>
    </div>
  </div>
  <div id="mw"><canvas id="mc"></canvas><div id="pose">X:0.00 Y:0.00 θ:0°</div></div>
</div>

<div id="right">

  <!-- Speed presets -->
  <div class="p">
    <div class="pt">Speed Preset</div>
    <div id="speed-grid">
      <button class="spd-btn" data-v="44" onclick="setSpd(this)">20%</button>
      <button class="spd-btn" data-v="88" onclick="setSpd(this)">40%</button>
      <button class="spd-btn active" data-v="132" onclick="setSpd(this)">60%</button>
      <button class="spd-btn" data-v="176" onclick="setSpd(this)">80%</button>
      <button class="spd-btn" data-v="220" onclick="setSpd(this)">MAX</button>
    </div>

    <!-- D-Pad -->
    <div id="dpad">
      <div class="dp empty"></div>
      <div class="dp" id="dp-fwd" data-dir="fwd">▲</div>
      <div class="dp empty"></div>
      <div class="dp" id="dp-lft" data-dir="lft">◀</div>
      <div class="dp" id="dp-stp" data-dir="stp" style="font-size:10px;color:var(--d)">■</div>
      <div class="dp" id="dp-rgt" data-dir="rgt">▶</div>
      <div class="dp empty"></div>
      <div class="dp" id="dp-rev" data-dir="rev">▼</div>
      <div class="dp empty"></div>
    </div>

    <div class="mb-wrap"><span>L</span><div class="mb-out"><div class="mb-in" id="ml"></div></div></div>
    <div class="mb-wrap"><span>R</span><div class="mb-out"><div class="mb-in" id="mr"></div></div></div>
  </div>

  <!-- Mode -->
  <div class="p">
    <div class="pt">Mode</div>
    <div class="btn-row">
      <button class="btn active" id="bm" onclick="setMode('manual')">Manual</button>
      <button class="btn" id="be" onclick="setMode('explore')">Explore</button>
      <button class="btn" id="bp" onclick="setMode('patrol')">Patrol</button>
    </div>
  </div>

  <!-- Safety -->
  <div class="p">
    <div class="pt">Safety</div>
    <button id="estop" onclick="doEstop()">⏹ EMERGENCY STOP</button>
    <div class="btn-row" style="margin-top:5px">
      <button class="btn" onclick="doResume()">Resume</button>
      <button class="btn" onclick="doSave()">Save Map</button>
    </div>
  </div>

  <!-- Telemetry -->
  <div class="p">
    <div class="pt">Telemetry</div>
    <div class="tg">
      <div class="tc"><div class="l">CPU</div><div class="v" id="tcpu">—</div></div>
      <div class="tc"><div class="l">RAM</div><div class="v" id="tram">—</div></div>
      <div class="tc"><div class="l">FPS</div><div class="v" id="tfps">—</div></div>
      <div class="tc"><div class="l">Latency</div><div class="v" id="tlat">—</div></div>
      <div class="tc"><div class="l">L PWM</div><div class="v" id="tml">0</div></div>
      <div class="tc"><div class="l">R PWM</div><div class="v" id="tmr">0</div></div>
    </div>
  </div>
</div>
</div>

<script>
const io_sock = io({transports:['websocket'], upgrade:false, reconnection:true, reconnectionDelay:500});
let spd=132, mode='manual', estopOn=false, lastPing=Date.now();
let curL=0, curR=0, dirPressed=null, cmdInterval;

// ── Socket ──────────────────────────────────────────────────────────────────
io_sock.on('connect', ()=>dot('ds',true));
io_sock.on('disconnect', ()=>{ dot('ds',false); stopMotors(); });
io_sock.on('pong_r', ()=>{
  const lat = Date.now()-lastPing;
  document.getElementById('hlat').textContent='LAT: '+lat+'ms';
  document.getElementById('tlat').textContent=lat+'ms';
});
io_sock.on('tel', d=>{
  dot('da', d.ard); dot('dc', d.cam);
  document.getElementById('hfps').textContent='FPS: '+d.fps;
  document.getElementById('tfps').textContent=d.fps;
  if(d.cpu!=null) setV('tcpu', d.cpu+'%', d.cpu>80);
  if(d.ram!=null) setV('tram', d.ram+'%', d.ram>85);
  setV('tml', d.ml||0); setV('tmr', d.mr||0);
});

function dot(id,ok){ const e=document.getElementById(id); if(e) e.className='dot '+(ok?'ok':'err'); }
function setV(id,v,w=false){ const e=document.getElementById(id); if(e){e.textContent=v;e.className='v'+(w?' w':'');} }

// Ping every second
setInterval(()=>{ lastPing=Date.now(); io_sock.emit('ping_r'); }, 1000);
setInterval(()=>{ document.getElementById('clk').textContent=new Date().toLocaleTimeString(); }, 1000);

// ── Speed presets ───────────────────────────────────────────────────────────
function setSpd(btn){
  spd = parseInt(btn.dataset.v);
  document.querySelectorAll('.spd-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Direction pad ───────────────────────────────────────────────────────────
function dirToMotors(dir){
  const s = spd;
  const map = {
    fwd: [s, s],
    rev: [-s, -s],
    lft: [-s, s],
    rgt: [s, -s],
    stp: [0, 0],
  };
  return map[dir] || [0,0];
}

function sendCmd(l, r){
  if(estopOn || mode !== 'manual') return;
  curL=l; curR=r;
  io_sock.emit('cmd', {l, r});
  setBar('ml', l); setBar('mr', r);
  setV('tml', l); setV('tmr', r);
}

function stopMotors(){ sendCmd(0,0); }

function setBar(id, v){
  const e=document.getElementById(id);
  const pct=Math.abs(v)/220*100;
  e.style.width=pct+'%';
  e.className='mb-in'+(v<0?' rev':'');
}

// D-pad press/release — send continuously while held
document.querySelectorAll('.dp[data-dir]').forEach(btn=>{
  const start = e=>{ e.preventDefault(); dirPressed=btn.dataset.dir; btn.classList.add('pressed'); };
  const end   = e=>{ e.preventDefault(); dirPressed=null; btn.classList.remove('pressed'); stopMotors(); };
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('mouseup', end);
  btn.addEventListener('touchend', end);
  btn.addEventListener('mouseleave', end);
});

// Command loop — 25Hz, only sends while button held
cmdInterval = setInterval(()=>{
  if(dirPressed && dirPressed !== 'stp'){
    const [l,r] = dirToMotors(dirPressed);
    sendCmd(l, r);
  }
}, 40);

// ── Keyboard ────────────────────────────────────────────────────────────────
const keyMap = {ArrowUp:'fwd', w:'fwd', ArrowDown:'rev', s:'rev', ArrowLeft:'lft', a:'lft', ArrowRight:'rgt', d:'rgt'};
window.addEventListener('keydown', e=>{
  if(e.key===' '){ e.preventDefault(); doEstop(); return; }
  const dir = keyMap[e.key];
  if(dir){ e.preventDefault(); dirPressed=dir; document.getElementById('dp-'+dir)?.classList.add('pressed'); }
});
window.addEventListener('keyup', e=>{
  const dir = keyMap[e.key];
  if(dir){ dirPressed=null; document.getElementById('dp-'+dir)?.classList.remove('pressed'); stopMotors(); }
});

// ── Mode ────────────────────────────────────────────────────────────────────
function setMode(m){
  mode=m;
  ['manual','explore','patrol'].forEach(id=>document.getElementById('b'+id[0])?.classList.toggle('active',id===m));
  const tag=document.getElementById('mtag');
  const cls={manual:'tm',explore:'te',patrol:'tp'};
  tag.textContent=m.toUpperCase(); tag.className='tag '+cls[m];
  io_sock.emit('mode',{value:m});
}

// ── Safety ──────────────────────────────────────────────────────────────────
function doEstop(){
  estopOn=true;
  io_sock.emit('estop');
  const b=document.getElementById('estop');
  b.textContent='✓ STOPPED'; b.className='stopped';
}
function doResume(){
  estopOn=false;
  io_sock.emit('estop_clear');
  const b=document.getElementById('estop');
  b.textContent='⏹ EMERGENCY STOP'; b.className='';
}
function doSave(){
  fetch('/api/map/save?name=default',{method:'POST'})
    .then(r=>r.json()).then(()=>alert('Map saved'))
    .catch(()=>alert('Save not available in this mode'));
}

// ── Map canvas ──────────────────────────────────────────────────────────────
const mc=document.getElementById('mc');
const mctx=mc.getContext('2d');
function drawMap(data){ /* placeholder for SLAM map */ }
</script>
</body>
</html>
